name: RC ORDERA — Android debug APK for internal verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'app.js'
      - 'www/app.js'
      - 'cliente.js'
      - 'mesero.js'
      - 'restaurante.html'
      - 'restaurant-fiscal-ui.js'
      - 'scripts/prepare-capacitor.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-ordera-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build unsigned-production / debug-only Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact audited commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21 for Capacitor 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v4 creates ANDROID_HOME and no longer installs Google's retired
      # "tools" SDK package that broke the initial v3 CI run.
      - name: Set up maintained Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK 36
        run: |
          test -n "${ANDROID_HOME:-}"
          command -v sdkmanager
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts=false

      - name: Validate application and native window integration
        run: |
          node --test tests/android-native-module-browser.test.cjs
          node --test tests/restaurant-navigation-fiscal.test.cjs
          node --test tests/station-menu-resume.test.cjs
          node --test tests/restaurant-menu-publication-audit.test.cjs

      - name: Generate Android native platform from latest web assets
        run: |
          npm run android:prepare-web
          npx cap add android
          npx cap sync android

      - name: Verify Browser plugin packaged into native project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          test -f android/app/src/main/assets/public/restaurante.html
          grep -q 'restaurant-fiscal-ui.js' android/app/src/main/assets/public/restaurante.html

      - name: Build debug-only APK (NOT a production release)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK for owner verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RC-ORDERA-ANDROID-DEBUG-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
