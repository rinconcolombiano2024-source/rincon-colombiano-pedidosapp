name: RC ORDERA QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-ordera-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sumup-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: rc_ordera_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rc-local-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PostgreSQL client
        run: psql --version
      - name: Verify SumUp migrations and concurrent ledger writes
        run: node scripts/test-sumup-postgres.mjs
        env:
          RC_TEST_CONFIRM_DISPOSABLE_POSTGRES: "YES"
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGDATABASE: rc_ordera_ci
          PGUSER: postgres
          PGPASSWORD: rc-local-ci-only
  validate:
    # Runner explícito para reproducibilidad.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cliente.js
          node --check colaborador.js
          node --check mesero.js
          node --check admin.js
          node --check service-worker.js
          node --check auto-translate.js
          node --check offline-i18n.js

      - name: "Audit all dependencies (blocking, high and critical)"
        run: npm audit --audit-level=high

      - name: "Audit all dependencies incl. build tools (informational, moderate)"
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Assert distribution matches committed sources
        run: npm run qa:policy

      - name: Run static QA
        run: npm run qa
        timeout-minutes: 8

      - name: Run i18n QA
        run: npm run qa:i18n

      - name: Verify integration harness availability
        run: npm run qa:integration

      - name: Prepare Android web runtime
        run: |
          npm run android:prepare-web
          git diff --exit-code -- www/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Run E2E smoke tests
        run: npm run qa:e2e
        timeout-minutes: 8
        env:
          CI: "true"
          RC_E2E_FULL_MATRIX: "1"

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
